[plugin]

name="Device Power"
description="Power source, battery saver, thermal status and Android Game Mode for Godot games, plus a frame-cap policy built on them: full refresh on external power, a lower cap on battery or when hot. On Android, bundles a Kotlin plugin into Gradle exports. On Linux, including Steam Deck, reads sysfs. On Windows, an optional GDExtension reads GetSystemPowerStatus."
author="Kevin Coughlin"
version="0.1.1"
script="plugin.gd"
