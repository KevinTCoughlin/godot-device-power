name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdscript:
    name: GDScript suite and editor load (Godot ${{ matrix.godot_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 4.8 beta 2 is a preview. A failure there is reported and does not fail
    # the workflow; 4.7.2 still does.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot_version: "4.7.2"
            setup_version: "4.7.2"
            experimental: false
          # setup-godot's semver parser needs the patch component. Godot
          # publishes this preview as 4.8-beta3 (patch 0).
          - godot_version: "4.8-beta3"
            setup_version: "4.8.0-beta3"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: ${{ matrix.setup_version }}
          use-dotnet: false
          include-templates: false
      # Mock- and fake-backed: no device, display or Android SDK needed.
      - name: Run the GDScript suite
        run: ./scripts/run_tests.sh
      - name: Load the editor plugin and export plugin
        run: ./scripts/check.sh editor

  android:
    name: Android plugin (Gradle build, unit tests, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Read-only on pull requests and tags: only main writes the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The runner image ships the Android SDK (ANDROID_HOME) with its
      # licences accepted; AGP installs platform 36 if the image lacks it.
      - name: Build the AARs, run the JVM unit tests and Android lint
        run: ./scripts/build_android.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device_power-aars
          path: addons/device_power/bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          path: android-plugin/plugin/build/reports/

  # Compiles the same plugin against the godot-lib AAR from the 4.8 beta 2
  # release. That coordinate is not on Maven Central (newest there is
  # 4.7.2.stable); the default build pin stays 4.7.2.stable. A failure here
  # does not fail the workflow.
  android-preview:
    name: Android plugin against Godot 4.8-beta3 godot-lib (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build against the 4.8-beta3 godot-lib AAR
        run: ./scripts/check_godot_lib.sh

  lint:
    name: Lint (gdformat, gdlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Tool versions are pinned in scripts/check.sh and run through uvx, so
      # these match a local `scripts/check.sh lint` exactly.
      - name: gdformat and gdlint
        run: ./scripts/check.sh gdscript
      - name: bash -n and shellcheck
        run: ./scripts/check.sh shell

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every commit in the pull request needs a Signed-off-by line naming its
      # author (CONTRIBUTING.md). Merge commits are exempt, and so are
      # Dependabot's own commits: it cannot sign off, and its version bumps
      # are reviewed like any other change before they merge.
      - name: Check every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              continue
            fi
            if ! git show -s --format=%B "$sha" | grep -qxF "Signed-off-by: ${author}"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") has no 'Signed-off-by: ${author}'"
              missing=1
            fi
          done
          exit "$missing"
