name: Bug report
description: Something behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here; see
        [SECURITY.md](https://github.com/KevinTCoughlin/godot-device-power/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Unplugged the charger mid-game. Expected recommended_fps_cap() to become 60;
        it stayed 0.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Ideally the steps against the demo project (demo/demo.tscn).
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Addon version
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true

  - type: input
    id: godot-version
    attributes:
      label: Godot version
      placeholder: "4.7.2.stable"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Which backend is active?
      description: "`print(DevicePower.get_backend_name())`"
      options:
        - android_plugin
        - android
        - "null"
        - mock
        - "not sure"
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Device
      description: >-
        Model, Android version, the refresh rates the demo shows, and whether
        the export used a Gradle build.
      placeholder: |
        Pixel 10, Android 16, rates [60, 120], Gradle build
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: "`adb logcat -s DevicePower godot` around the problem."
      render: text
