name: Feature request
description: Propose a reading, a platform or a policy change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation in a game, not the API you have in mind.
      placeholder: >-
        My game heats a mid-range phone within ten minutes even at 60 fps.
    validations:
      required: true

  - type: textarea
    id: platform
    attributes:
      label: Platform API
      description: Which platform API would this read or call, and from which API level?

  - type: textarea
    id: api-sketch
    attributes:
      label: Proposed Godot API
      description: >-
        A sketch of how it would look from GDScript, including what it reports
        when the platform cannot answer.
      render: gdscript

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: This project keeps a small, typed, mockable API and adds no permissions.
      options:
        - label: This can be expressed as a typed API that a mock backend can implement.
        - label: This needs no Android permission.
